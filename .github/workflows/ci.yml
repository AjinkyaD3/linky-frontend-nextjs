name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    env:
      # The build only needs these to be *present* and well-formed: they feed
      # metadataBase and the CSP allowlist. No real backend is contacted.
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SITE_URL: https://linky.ajinkyadhotre.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: fails loudly if package-lock.json is out of date.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
